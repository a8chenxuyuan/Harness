# Alembic config - database schema versioning.
# Usage:
#   alembic upgrade head      # upgrade to latest
#   alembic downgrade -1      # rollback one revision
#   alembic revision --autogenerate -m "xxx"
#   alembic current           # show current revision

[alembic]
script_location = src/harness/platform/db/alembic
version_table = alembic_version
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
